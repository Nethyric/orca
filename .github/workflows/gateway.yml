name: Deploy gateway (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/gateway.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ensure KV namespace exists and patch wrangler.toml
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 kv namespace list > kv.json || echo "[]" > kv.json
          ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('kv.json','utf8'));const n=l.find(x=>/ORCA_KV/.test(x.title));console.log(n?n.id:'')")
          if [ -z "$ID" ]; then npx --yes wrangler@4 kv namespace create ORCA_KV > out.txt; cat out.txt; ID=$(grep -oE '[a-f0-9]{32}' out.txt | head -1); fi
          echo "KV id: $ID"
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy
          secrets: |
            UPSTREAMS
            BUILD_TOKEN
            ADMIN_TOKEN
        env:
          UPSTREAMS: ${{ secrets.UPSTREAMS }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
