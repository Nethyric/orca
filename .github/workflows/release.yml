name: Release (Windows · macOS · Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: ubuntu-latest
            artifact: win
            target: win
            arch: x64
            cmd: npm run dist:win
          - name: macOS x64
            os: macos-14
            artifact: mac-x64
            target: mac
            arch: x64
            cmd: node scripts/bake.js && npx electron-builder --publish never --mac --x64 && node scripts/finish-unix.js mac
          - name: macOS arm64
            os: macos-14
            artifact: mac-arm64
            target: mac
            arch: arm64
            cmd: node scripts/bake.js && npx electron-builder --publish never --mac --arm64 && node scripts/finish-unix.js mac
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux
            target: linux
            arch: x64
            cmd: npm run dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Fetch bundled binaries (ffmpeg, yt-dlp, tessdata)
        env:
          ORCA_TARGET: ${{ matrix.target }}
          ORCA_ARCH: ${{ matrix.arch }}
        run: node scripts/fetch-bins.js
      - name: Build
        env:
          ORCA_VAULT_KEY: ${{ secrets.ORCA_VAULT_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp release/ORCA-Agent-*.zip out/ 2>/dev/null || true
          cp release/ORCA-Agent-*.dmg out/ 2>/dev/null || true
          cp release/ORCA-Agent-*.AppImage out/ 2>/dev/null || true
          cp release/ORCA-Agent-*.tar.gz out/ 2>/dev/null || true
          cp release/ORCA-Agent-*.deb out/ 2>/dev/null || true
          cp release/README-*.txt out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum ORCA-Agent-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 - "$VER" <<'PY'
          import re, sys
          ver = sys.argv[1]
          md = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', md, re.S | re.M)
          body = (m.group(1).strip() if m else '') or f'ORCA {ver} — see the changelog for details.'
          head = f'ORCA {ver} — download the package for your system below.\n\n'
          tail = ('\n\n---\n\nEvery package is listed in `SHA256SUMS`; the desktop app verifies updates '
                  'against it automatically (Settings → Updates).')
          open('dist/RELEASE-NOTES.md', 'w', encoding='utf-8').write(head + body + tail + '\n')
          print(open('dist/RELEASE-NOTES.md', encoding='utf-8').read())
          PY
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ORCA ${{ github.ref_name }}
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/ORCA-Agent-*
            dist/README-*.txt
            dist/SHA256SUMS
            remote/vault.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
