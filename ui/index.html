<div id="app">
  <header id="titlebar">
    <div class="tb-side tb-start">
      <button class="ib" id="rail-toggle" data-tip="Ctrl+B"><svg><use href="#i-panel-l"/></svg></button>
      <img src="/assets/logo.png" class="tb-logo" alt="">
      <span class="tb-name">ORCA</span>
      <span class="dot" id="tb-status"></span>
    </div>
    <div class="tb-center" id="tb-title"></div>
    <div class="tb-side tb-end">
      <button class="ib" id="tb-theme" data-tip="Theme"><svg><use href="#i-moon"/></svg></button>
      <button class="tb-lang" id="tb-lang">EN</button>
      <span class="win-btns">
        <button class="wb" data-win="min"><svg><use href="#i-minimize"/></svg></button>
        <button class="wb" data-win="max"><svg><use href="#i-maximize"/></svg></button>
        <button class="wb wb-close" data-win="close"><svg><use href="#i-x"/></svg></button>
      </span>
    </div>
  </header>

  <div id="body">
    <aside id="rail">
      <div class="rail-top">
        <button id="new-chat" class="btn btn-primary btn-block"><svg><use href="#i-plus"/></svg><span data-i18n="newChat">گفتگوی جدید</span><kbd>Ctrl N</kbd></button>
        <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="جست‌وجو…" data-i18n-ph="searchPh" autocomplete="off"><kbd>Ctrl K</kbd></label>
      </div>
      <nav id="chat-list" class="scroll"></nav>
      <div class="rail-bottom">
        <button class="rail-link" id="open-leaderboard"><svg><use href="#i-trophy"/></svg><span data-i18n="leaderboard">رتبه‌بندی</span></button>
        <button class="rail-link" id="open-memory"><svg><use href="#i-brain"/></svg><span data-i18n="memory">حافظه</span></button>
        <button class="rail-link" id="open-settings"><svg><use href="#i-settings"/></svg><span data-i18n="settings">تنظیمات</span><kbd>Ctrl ,</kbd></button>
      </div>
    </aside>

    <main id="main">
      <div id="modebar">
        <div class="seg" id="mode-seg" role="tablist">
          <button data-mode="direct" class="active"><svg><use href="#i-chat"/></svg><span data-i18n="modeDirect">گفتگو</span></button>
          <button data-mode="side"><svg><use href="#i-compare"/></svg><span data-i18n="modeSide">مقایسه</span></button>
          <button data-mode="battle"><svg><use href="#i-swords"/></svg><span data-i18n="modeBattle">نبرد</span></button>
        </div>
        <div class="modebar-end">
          <div class="picker" id="pick-single"></div>
          <div class="picker hidden" id="pick-a" data-slot="A"></div>
          <div class="picker hidden" id="pick-b" data-slot="B"></div>
          <button class="ib" id="toggle-panel" data-tip="Ctrl+."><svg><use href="#i-panel-r"/></svg></button>
        </div>
      </div>

      <section id="thread" class="scroll">
        <div id="welcome">
          <div class="hero">
            <img src="/assets/logo.png" class="hero-logo" alt="">
            <h1><span data-i18n="heroTitle">امروز چه چیزی بسازیم؟</span></h1>
            <p data-i18n="tagline">می‌نویسد، اجرا می‌کند، جست‌وجو می‌کند، اشکال‌زدایی می‌کند — روی همین سیستم.</p>
          </div>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div id="messages"></div>
        <button id="jump-bottom" class="hidden"><svg><use href="#i-chev"/></svg></button>
      </section>

      <div id="composer-wrap">
        <div id="status-line" class="hidden"><span class="spinner"></span><span id="status-text"></span><span id="status-steps" class="mono"></span><button id="stop-btn"><svg><use href="#i-stop"/></svg><span data-i18n="stop">توقف</span><kbd>Esc</kbd></button></div>
        <div id="attach-list" class="attach-list hidden"></div>
        <div id="composer">
          <textarea id="input" rows="1" placeholder="…" data-i18n-ph="inputPh"></textarea>
          <div class="composer-bar">
            <div class="composer-tools">
              <button class="chip" id="plan-toggle" data-tip="حالت نقشه: فقط برنامه می‌دهد، چیزی نمی‌سازد (Plan mode)"><svg><use href="#i-plan"/></svg><span data-i18n="plan">نقشه</span></button>
              <div class="seg seg-sm" id="autonomy">
                <button data-a="ask" data-tip="Ask before every action"><svg><use href="#i-lock"/></svg></button>
                <button data-a="auto" class="active" data-tip="Auto — confirm only risky actions"><svg><use href="#i-bolt"/></svg></button>
                <button data-a="yolo" data-tip="Full autonomy"><svg><use href="#i-rocket"/></svg></button>
              </div>
              <button class="chip chip-icon" id="attach-btn" data-tip="Attach files"><svg><use href="#i-attach"/></svg></button>
              <input type="file" id="file-input" multiple hidden>
              <span class="ws-chip mono" id="ws-path"></span>
            </div>
            <div class="composer-end">
              <span class="hint" id="send-hint">Enter ↵</span>
              <button id="send" class="send-btn" data-tip="Send"><svg><use href="#i-send"/></svg></button>
            </div>
          </div>
        </div>
        <div class="footnote"><span data-i18n="footnote">ORCA می‌تواند اشتباه کند — خروجی‌های مهم را بررسی کنید.</span></div>
      </div>
    </main>

    <aside id="panel" class="collapsed">
      <div class="panel-tabs" role="tablist">
        <button data-tab="timeline" class="active"><svg><use href="#i-clock"/></svg><span data-i18n="tabTimeline">تایم‌لاین</span></button>
        <button data-tab="files"><svg><use href="#i-folder"/></svg><span data-i18n="tabFiles">فایل‌ها</span></button>
        <button data-tab="changes"><svg><use href="#i-code"/></svg><span data-i18n="tabChanges">تغییرات</span><b class="badge hidden" id="chg-badge"></b></button>
        <button data-tab="preview"><svg><use href="#i-image"/></svg><span data-i18n="tabPreview">پیش‌نمایش</span></button>
      </div>
      <div class="panel-body scroll">
        <div id="tab-timeline" class="tab active"><div class="empty" data-i18n="emptyTimeline">ابزارهایی که ORCA اجرا می‌کند این‌جا ثبت می‌شوند.</div></div>
        <div id="tab-files" class="tab"><div class="tab-actions"><span class="mono ws-lbl" id="ws-lbl"></span><span class="grow"></span><button class="ib sm" id="refresh-files" data-tip="Refresh"><svg><use href="#i-refresh"/></svg></button><button class="ib sm" id="open-ws" data-tip="Open folder"><svg><use href="#i-external"/></svg></button></div><div id="file-tree"></div></div>
        <div id="tab-changes" class="tab"><div class="tab-actions"><button class="btn sm" id="restore-all" data-i18n="restoreAll">بازگردانی همه</button><span class="grow"></span></div><div id="changes-list"></div></div>
        <div id="tab-preview" class="tab"><div class="tab-actions"><span id="preview-name" class="mono"></span><span class="grow"></span><span id="preview-actions"></span><button id="preview-save" class="btn sm primary hidden" data-i18n="save">ذخیره</button></div><div id="preview-body"></div></div>
      </div>
    </aside>
  </div>

  <div id="cmdk" class="hidden"><div class="cmdk-card"><label class="search big"><svg><use href="#i-search"/></svg><input id="cmdk-input" placeholder="…" autocomplete="off"></label><div id="cmdk-list" class="scroll"></div></div></div>
  <div id="modal" class="hidden"><div class="modal-card"><button class="ib modal-x"><svg><use href="#i-x"/></svg></button><div id="modal-body" class="scroll"></div></div></div>
  <div id="toasts"></div>
  <div id="tip"></div>
</div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/vendor/highlight.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
